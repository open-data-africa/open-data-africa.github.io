<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Dashboard | Open Data Africa</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Link to your EXISTING CSS so it matches perfectly -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Chart.js for Visualizations -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Dashboard-specific enhancements using your existing variables */
    .dashboard-hero {
      background: linear-gradient(135deg, var(--german-black) 0%, #3a3a3a 100%);
      padding: 80px 1rem 60px; text-align: center; color: var(--white);
    }
    .dashboard-hero h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    .dashboard-hero h1 span { color: var(--german-gold); }
    
    .stats-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; margin-top: -40px; position: relative; z-index: 10;
      max-width: 1200px; margin-left: auto; margin-right: auto; padding: 0 20px;
    }
    .stat-box {
      background: var(--white); padding: 25px; border-radius: var(--radius-lg);
      text-align: center; box-shadow: var(--shadow-lg); border-top: 4px solid var(--german-red);
    }
    .stat-box .number { font-size: 2.5rem; font-weight: 800; color: var(--german-black); display: block; }
    .stat-box .label { font-size: 0.9rem; color: var(--gray); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

    .charts-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 30px; max-width: 1200px; margin: 60px auto; padding: 0 20px;
    }
    .chart-card {
      background: var(--white); padding: 30px; border-radius: var(--radius-lg);
      box-shadow: var(--shadow); border: 1px solid var(--gray-light);
    }
    .chart-card h3 { font-size: 1.2rem; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .chart-card h3 i { color: var(--german-red); }
    .chart-container { position: relative; height: 300px; }

    .trending-section { max-width: 1200px; margin: 0 auto 80px; padding: 0 20px; }
    .trending-card {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--white); padding: 20px; border-radius: var(--radius);
      margin-bottom: 15px; border: 1px solid var(--gray-light); transition: var(--transition);
    }
    .trending-card:hover { transform: translateX(5px); border-color: var(--german-gold); box-shadow: var(--shadow); }
    .trending-info h4 { font-size: 1.1rem; margin-bottom: 5px; }
    .trending-info h4 a { color: var(--german-black); }
    .trending-info h4 a:hover { color: var(--german-red); }
    .trending-meta { font-size: 0.85rem; color: var(--gray); display: flex; gap: 15px; }
    .trending-score {
      background: var(--german-gold); color: var(--german-black); padding: 8px 16px;
      border-radius: 20px; font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 6px;
    }
  each>
</head>
<body>

  <!-- German Flag Bar -->
  <div class="flag-bar"><div class="black"></div><div class="red"></div><div class="gold"></div></div>

  <!-- Navigation (Matches your existing nav) -->
  <nav>
    <div class="wrapper">
      <button class="mobile-menu-toggle" aria-label="Toggle menu" onclick="toggleMenu()">
        <i class="fas fa-bars"></i>
      </button>
      <ul class="nav-list" id="navList">
        <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="about.html"><i class="fas fa-info-circle"></i> About</a></li>
        <li><a href="datasets.html"><i class="fas fa-database"></i> Datasets</a></li>
        <li><a href="dashboard.html" aria-current="page"><i class="fas fa-chart-bar"></i> Dashboard</a></li>
        <li><a href="contribute.html"><i class="fas fa-upload"></i> Contribute</a></li>
      </ul>
    </div>
  </nav>

  <!-- Hero -->
  <header class="dashboard-hero">
    <div class="wrapper">
      <h1>Interactive Data <span>Dashboard</span></h1>
      <p>Real-time analytics, domain distribution, and trending datasets across the African AI ecosystem.</p>
    </div>
  </header>

  <main>
    <!-- Live Stats Row -->
    <div class="stats-row" id="statsRow">
      <div class="stat-box"><span class="number">...</span><span class="label">Loading</span></div>
    </div>

    <!-- Charts Grid -->
    <div class="charts-grid">
      <div class="chart-card">
        <h3><i class="fas fa-chart-pie"></i> Datasets by Domain</h3>
        <div class="chart-container"><canvas id="domainChart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3><i class="fas fa-chart-bar"></i> Top Countries</h3>
        <div class="chart-container"><canvas id="countryChart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3><i class="fas fa-chart-column"></i> Data Types</h3>
        <div class="chart-container"><canvas id="typeChart"></canvas></div>
      </div>
    </div>

    <!-- Trending Datasets -->
    <section class="trending-section">
      <h2 style="text-align: center; margin-bottom: 30px; font-size: 2rem;"><i class="fas fa-fire" style="color: var(--german-red);"></i> Trending Datasets</h2>
      <p style="text-align: center; color: var(--gray); margin-bottom: 30px; max-width: 600px; margin-left: auto; margin-right: auto;">
        Based on community engagement (views, metadata downloads, and link copies).
      </p>
      <div id="trendingList">
        <!-- Populated by JS -->
      </div>
    </section>
  </main>

  <!-- Footer (Matches your existing footer) -->
  <footer>
    <div class="wrapper">
      <div class="footer-content">
        <div>
          <h4><i class="fas fa-globe-africa"></i> Open Data Africa</h4>
          <p>Open data ecosystems across Africa through benchmarking, recognition, and capacity building.</p>
        </div>
        <div>
          <h4><i class="fas fa-link"></i> Quick Links</h4>
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="datasets.html">Datasets</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
          </ul>
        </div>
        <div>
          <h4><i class="fas fa-envelope"></i> Contact</h4>
          <p><i class="fas fa-envelope"></i> aimadeinafrica@giz.de</p>
          <p><i class="fas fa-map-marker-alt"></i> GIZ African Union, Addis Ababa, Ethiopia</p>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; 2026 Open Data Africa | AI Made in Africa / GIZ AU </p>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/metrics.js"></script>
  <script>
    // Mobile menu toggle (from your existing code)
    function toggleMenu() { document.getElementById('navList').classList.toggle('active'); }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const response = await fetch('data/datasets.json');
        const catalog = await response.json();

        // 1. Calculate Stats
        const totalDatasets = catalog.length;
        const uniqueCountries = [...new Set(catalog.map(d => d['Country']))].filter(Boolean).length;
        const uniqueDomains = [...new Set(catalog.map(d => d['Domain']))].filter(Boolean).length;
        
        // Calculate total engagement across all datasets
        const allMetrics = DatasetMetrics.get();
        const totalEngagement = Object.values(allMetrics).reduce((sum, m) => sum + m.views + m.downloads + m.copies, 0);

        document.getElementById('statsRow').innerHTML = `
          <div class="stat-box"><span class="number">${totalDatasets}</span><span class="label">Total Datasets</span></div>
          <div class="stat-box"><span class="number">${uniqueCountries}</span><span class="label">Countries</span></div>
          <div class="stat-box"><span class="number">${uniqueDomains}</span><span class="label">Domains</span></div>
          <div class="stat-box"><span class="number">${totalEngagement}</span><span class="label">Total Interactions</span></div>
        `;

        // 2. Render Charts
        const brandColors = ['#c8102e', '#ffce00', '#1a1a1a', '#6c757d', '#e9ecef', '#a00d26'];

        function renderChart(canvasId, type, labels, key) {
          const counts = labels.map(l => catalog.filter(d => d[key] === l).length);
          new Chart(document.getElementById(canvasId), {
            type: type,
            data: {
              labels: labels,
              datasets: [{
                data: counts,
                backgroundColor: brandColors.slice(0, labels.length),
                borderWidth: 0,
                borderRadius: type === 'bar' ? 4 : 0
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: type === 'doughnut' ? 'bottom' : 'none', labels: { boxWidth: 12, font: { size: 11 } } }
              },
              scales: type === 'doughnut' ? {} : { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
            }
          });
        }

        const domains = [...new Set(catalog.map(d => d['Domain']))].filter(Boolean).sort();
        const countries = [...new Set(catalog.map(d => d['Country']))].filter(Boolean).sort();
        const types = [...new Set(catalog.map(d => d['Data Type']))].filter(Boolean).sort();

        renderChart('domainChart', 'doughnut', domains.slice(0, 6), 'Domain'); // Top 6 domains
        renderChart('countryChart', 'bar', countries.slice(0, 6), 'Country');   // Top 6 countries
        renderChart('typeChart', 'bar', types.slice(0, 6), 'Data Type');        // Top 6 types

        // 3. Render Trending Datasets
        const trending = DatasetMetrics.getTopDatasets(catalog, 5);
        const trendingList = document.getElementById('trendingList');
        
        if (trending.length === 0 || trending[0].engagementScore === 0) {
          trendingList.innerHTML = '<p style="text-align:center; color: var(--gray);">Interact with datasets on the site to see trending analytics here!</p>';
        } else {
          trending.forEach(d => {
            const card = document.createElement('div');
            card.className = 'trending-card';
            card.innerHTML = `
              <div class="trending-info">
                <h4><a href="${d['Link']}" target="_blank" onclick="DatasetMetrics.trackView('${d['Dataset Name'].replace(/'/g, "\\'")}')">${d['Dataset Name']}</a></h4>
                <div class="trending-meta">
                  <span><i class="fas fa-globe-africa"></i> ${d['Country']}</span>
                  <span><i class="fas fa-tag"></i> ${d['Domain']}</span>
                  <span><i class="fas fa-eye"></i> ${d.stats.views} Views</span>
                  <span><i class="fas fa-download"></i> ${d.stats.downloads} Downloads</span>
                </div>
              </div>
              <div class="trending-score">
                <i class="fas fa-fire"></i> Score: ${d.engagementScore}
              </div>
            `;
            trendingList.appendChild(card);
          });
        }

      } catch (error) {
        console.error('Error loading dashboard:', error);
        document.getElementById('statsRow').innerHTML = '<p style="text-align:center; grid-column: 1/-1; color: var(--german-red);">Error loading data. Ensure <code>data/datasets.json</code> exists.</p>';
      }
    });
  </script>
</body>
</html>
